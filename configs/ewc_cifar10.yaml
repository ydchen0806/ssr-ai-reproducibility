experiment_name: ewc_split_cifar10

dataset:
  name: split_cifar10
  data_root: ./dataset
  n_tasks: 5

model:
  name: resnet18

method:
  name: ewc
  lambda_ewc: 400.0
  online: false
  fisher_samples: 2000

training:
  epochs: 50
  batch_size: 512
  optimizer: sgd
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0
  scheduler: multistep
  milestones: [35, 45]
  gamma: 0.1
  grad_clip: 5.0
  use_amp: true
  num_workers: 4
