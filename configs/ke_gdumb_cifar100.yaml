dataset:
  data_root: ./dataset
  n_edit_classes: 10
  n_edit_rounds: 5
  name: knowledge_editing
experiment_name: ke_gdumb_cifar100
method:
  buffer_size: 2000
  gdumb_epochs: 50
  name: gdumb
model:
  name: resnet18
training:
  batch_size: 512
  epochs: 10
  grad_clip: 5.0
  lr: 0.01
  momentum: 0.9
  num_workers: 4
  optimizer: sgd
  use_amp: true
  weight_decay: 0.0
