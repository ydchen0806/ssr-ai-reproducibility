experiment_name: ke_biocs_plus_cifar100

dataset:
  name: knowledge_editing
  data_root: ./dataset
  n_edit_rounds: 5
  n_edit_classes: 10

model:
  name: resnet18

method:
  name: biocs_plus
  lambda_spatial: 0.005
  lambda_distill: 5.0
  lambda_replay: 0.0
  lambda_spectral: 0.0
  lambda_feat: 0.0
  temperature: 2.0
  buffer_size: 0
  biocs_targets: ["classifier"]
  label_smoothing: 0.0

training:
  epochs: 10
  batch_size: 512
  optimizer: sgd
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0
  grad_clip: 5.0
  use_amp: true
  num_workers: 4
