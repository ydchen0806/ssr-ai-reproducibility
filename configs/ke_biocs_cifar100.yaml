experiment_name: ke_biocs_cifar100

dataset:
  name: knowledge_editing
  data_root: ./dataset
  n_edit_rounds: 5
  n_edit_classes: 10

model:
  name: resnet18

method:
  name: knowledge_editing
  lambda_spatial: 0.01
  lambda_spectral: 0.01
  lambda_locality: 1.0
  A_exc: 1.0
  A_inh: 0.8
  sigma_exc: 0.2
  sigma_inh: 0.5

training:
  epochs: 10
  batch_size: 512
  optimizer: sgd
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0
  grad_clip: 5.0
  use_amp: true
  num_workers: 4
