    data_offset: 0
    cohort_invariants:
      - dataset_hash
      - evaluator
      - evaluator_version
      - evaluation_protocol_hash
      - model_hash
      - pairing_protocol_hash
    required_metrics:
      - efficacy
      - locality
      - final_history_efficacy
      - final_history_locality
