dataset:
  data_root: ./dataset
  n_edit_classes: 10
  n_edit_rounds: 5
  name: knowledge_editing
experiment_name: ke_lwf_cifar100
method:
  lambda_distill: 1.0
  name: lwf
  temperature: 2.0
model:
  name: resnet18
training:
  batch_size: 512
  epochs: 10
  grad_clip: 5.0
  lr: 0.01
  momentum: 0.9
  num_workers: 4
  optimizer: sgd
  use_amp: true
  weight_decay: 0.0
