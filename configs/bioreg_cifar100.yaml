experiment_name: bioreg_split_cifar100

dataset:
  name: split_cifar100
  n_tasks: 10
  data_root: ./dataset

model:
  name: resnet18

method:
  name: bioreg
  lambda_reg: 1.0
  importance_mode: fisher       # fisher | path_integral | sensitivity
  homeostatic_scaling: false
  metaplasticity: false
  fisher_samples: 2000

training:
  epochs: 50
  batch_size: 512
  optimizer: sgd
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0
  scheduler: multistep
  milestones: [35, 45]
  gamma: 0.1
  grad_clip: 5.0
  use_amp: true
  num_workers: 4
