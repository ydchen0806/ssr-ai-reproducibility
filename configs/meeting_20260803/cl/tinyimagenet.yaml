experiment_name: meeting_20260803_tinyimagenet_matched_kd

dataset:
  name: split_tiny_imagenet
  data_root: ./dataset
  n_tasks: 10

model:
  name: resnet18

method:
  name: kd
  lambda_kd: 5.0
  temperature: 2.0
  lambda_ewc: 400.0
  lambda_mas: 1.0
  lambda_si: 1.0
  lambda_ssr: 0.005
  fisher_samples: 2000
  importance_samples: 2000
  xi: 0.1
  ssr_targets: [classifier]
  A_exc: 1.0
  A_inh: 0.8
  sigma_exc: 0.16
  sigma_inh: 0.45

training:
  epochs: 50
  batch_size: 512
  optimizer: sgd
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0
  scheduler: cosine
  warmup_epochs: 3
  grad_clip: 5.0
  use_amp: true
  num_workers: 4
