# The editor updates the ``weight`` tensors of the selected GPT-2 XL MLP
# projections directly.  It does not insert LoRA adapters in this cohort.
editor:
  target_module_regex: "(c_proj|down_proj)$"
  max_target_modules: 0
  editable_parameter: weight
  adapter_mode: none

# ``auto`` resolves to bf16 on supported CUDA hardware and fp16 otherwise;
# the resolved dtype is recorded in each run manifest.  An empty device map
# and attention implementation deliberately retain the standard Transformers
# placement and attention implementation rather than relying on an implicit
# accelerate or flash-attention configuration.
runtime:
  editor_device: cuda
  model_dtype: auto
  device_map: ""
  attention_implementation: ""
  cuda_visible_devices: inherited_from_scheduler
  determinism_policy: seeded_best_effort
  cudnn_deterministic: false
