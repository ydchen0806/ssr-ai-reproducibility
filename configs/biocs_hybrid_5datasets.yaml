experiment_name: biocs_hybrid_5datasets

dataset:
  name: five_datasets
  data_root: ./dataset

model:
  name: resnet18

method:
  name: bioreg
  regularization_mode: hybrid
  lambda_spatial: 0.001
  lambda_importance: 100.0
  A_exc: 1.0
  A_inh: 0.8
  sigma_exc: 0.2
  sigma_inh: 0.5
  biocs_targets: ["classifier"]
  use_seen_mask: true

training:
  epochs: 30
  batch_size: 512
  optimizer: sgd
  lr: 0.05
  momentum: 0.9
  weight_decay: 0.0
  scheduler: multistep
  milestones: [20, 25]
  gamma: 0.1
  grad_clip: 5.0
  use_amp: true
  num_workers: 4
