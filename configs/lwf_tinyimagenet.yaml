experiment_name: lwf_split_tinyimagenet

dataset:
  name: split_tiny_imagenet
  data_root: ./dataset
  n_tasks: 10

model:
  name: resnet18

method:
  name: lwf
  lambda_lwf: 1.0
  temperature: 2.0

training:
  epochs: 50
  batch_size: 128
  optimizer: sgd
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0
  scheduler: multistep
  milestones: [35, 45]
  gamma: 0.1
  grad_clip: 5.0
  use_amp: true
  num_workers: 4
