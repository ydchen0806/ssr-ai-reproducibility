dataset:
  data_root: ./dataset
  n_tasks: 10
  name: split_cifar100
experiment_name: cls_er_split_cifar100
method:
  buffer_size: 2000
  ema_alpha_plastic: 0.999
  ema_alpha_stable: 0.9999
  name: cls_er
  reg_weight: 0.5
model:
  name: resnet18
training:
  batch_size: 128
  epochs: 50
  gamma: 0.1
  grad_clip: 5.0
  lr: 0.1
  milestones:
  - 35
  - 45
  momentum: 0.9
  num_workers: 4
  optimizer: sgd
  scheduler: multistep
  use_amp: true
  weight_decay: 0.0
