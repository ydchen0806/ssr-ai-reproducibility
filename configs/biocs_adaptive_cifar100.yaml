experiment_name: biocs_adaptive_cifar100

dataset:
  name: split_cifar100
  data_root: ./dataset
  n_tasks: 10
  classes_per_task: 10

model:
  name: resnet18

method:
  name: bioreg
  regularization_mode: adaptive_biocs
  # SVD-health-driven adaptive scheduling
  adaptive_base_lambda: 0.001
  adaptive_max_lambda: 0.05
  spectral_threshold: 0.4
  # SSR kernel params
  A_exc: 1.0
  A_inh: 0.8
  sigma_exc: 0.2
  sigma_inh: 0.5
  biocs_targets: ["classifier"]
  use_seen_mask: true

training:
  epochs: 50
  batch_size: 512
  optimizer: sgd
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0
  scheduler: multistep
  milestones: [35, 45]
  gamma: 0.1
  grad_clip: 5.0
  use_amp: true
  num_workers: 4
